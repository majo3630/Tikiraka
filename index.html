<script>
    // CONFIGURACIÓN DE FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyA84D05AYtM7TTHFxPTT-_b3LojUqYMP08",
        authDomain: "tikiraka-app.firebaseapp.com",
        databaseURL: "https://tikiraka-app-default-rtdb.firebaseio.com",
        projectId: "tikiraka-app",
        storageBucket: "tikiraka-app.firebasestorage.app",
        messagingSenderId: "922023852175",
        appId: "1:922023852175:web:8bf69529b5da453b9658fa",
        measurementId: "G-K5JWMWHL7Y"
    };

    let db = null;
    let conectado = false;
    let listenersActivos = false;

    let DB = {
        inventario: [],
        caja: { efectivo: 0, nequi: 0 },
        historialBase: [],
        ventas: [],
        gastos: [],
        devoluciones: [],
        socios: []
    };

    let charts = {};

    function formatoMoneda(valor) {
        return '$ ' + Number(valor || 0).toLocaleString('es-CO');
    }

    /* ==========================================================
       PANEL Y CONEXIÓN A FIREBASE
       ========================================================== */
    function crearPanelConexion() {
        if (document.getElementById('panel-conexion-bd')) return;

        const panel = document.createElement('div');
        panel.id = 'panel-conexion-bd';
        panel.style.cssText = `
            position: fixed; top: 12px; right: 12px; z-index: 9999;
            background: #1c1c1c; border: 1px solid #d96b1a; border-radius: 8px;
            padding: 10px 14px; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.4); font-family: sans-serif;
        `;

        panel.innerHTML = `
            <span id="panel-conexion-texto" style="color:#eee; font-size:0.85rem;">
                Sin conexión a la base de datos
            </span>
            <button id="btn-conectar-bd" style="
                background:#d96b1a; color:#fff; border:none; border-radius:6px;
                padding:6px 12px; font-size:0.85rem; cursor:pointer;">
                Conectar a Base de Datos
            </button>
        `;

        document.body.appendChild(panel);
        document.getElementById('btn-conectar-bd').addEventListener('click', conectarBD);
    }

    function ocultarPanelConexion() {
        const panel = document.getElementById('panel-conexion-bd');
        if (panel) panel.remove();
    }

    function mostrarErrorConexion(mensaje) {
        const texto = document.getElementById('panel-conexion-texto');
        const boton = document.getElementById('btn-conectar-bd');
        if (texto) {
            texto.textContent = mensaje;
            texto.style.color = '#ff6b6b';
        }
        if (boton) {
            boton.textContent = 'Reintentar';
            boton.disabled = false;
        }
    }

    function precargarFirebase() {
        if (typeof firebase === 'undefined' || db) return;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.database();
        } catch (err) {
            console.error('Error al pre-inicializar Firebase:', err);
        }
    }

    function conectarBD() {
        const boton = document.getElementById('btn-conectar-bd');
        const texto = document.getElementById('panel-conexion-texto');
        if (boton) { boton.disabled = true; boton.textContent = 'Conectando...'; }
        if (texto) { texto.style.color = '#eee'; texto.textContent = 'Conectando...'; }

        if (typeof firebase === 'undefined') {
            mostrarErrorConexion('Falta cargar el SDK de Firebase.');
            return;
        }

        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            if (!db) db = firebase.database();
        } catch (err) {
            mostrarErrorConexion('Error de Firebase: ' + (err.message || err));
            return;
        }

        firebase.auth().signInAnonymously().catch((error) => {
            mostrarErrorConexion('Error de autenticación: ' + (error.message || 'desconocido'));
        });

        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                monitorearConexionRed();
                activarListenerPrincipal();
            } else {
                conectado = false;
            }
        });
    }

    let primerReporteSocket = true;
    function monitorearConexionRed() {
        try {
            db.ref('.info/connected').on('value', (snap) => {
                if (snap.val() === true) {
                    primerReporteSocket = false;
                    conectado = true;
                    ocultarPanelConexion();
                } else if (!primerReporteSocket) {
                    conectado = false;
                    crearPanelConexion();
                    mostrarErrorConexion('Conexión perdida, reconectando...');
                    const boton = document.getElementById('btn-conectar-bd');
                    if (boton) boton.style.display = 'none';
                }
            });
        } catch (err) {
            console.error('Error monitoreando la conexión:', err);
        }
    }

    function activarListenerPrincipal() {
        if (listenersActivos) return;
        listenersActivos = true;

        try {
            db.ref('tikiraka_app').on('value', (snapshot) => {
                if (!conectado) {
                    conectado = true;
                    ocultarPanelConexion();
                }
                const data = snapshot.val();
                if (data) {
                    DB.inventario = data.inventario ? Object.values(data.inventario) : [];
                    DB.caja = data.caja || { efectivo: 0, nequi: 0 };
                    DB.historialBase = data.historialBase ? Object.values(data.historialBase) : [];
                    DB.ventas = data.ventas ? Object.values(data.ventas) : [];
                    DB.gastos = data.gastos ? Object.values(data.gastos) : [];
                    DB.devoluciones = data.devoluciones ? Object.values(data.devoluciones) : [];
                    DB.socios = data.socios ? Object.values(data.socios) : [];
                } else {
                    DB = { inventario: [], caja: { efectivo: 0, nequi: 0 }, historialBase: [], ventas: [], gastos: [], devoluciones: [], socios: [] };
                }
                actualizarUI();
            }, (error) => {
                mostrarErrorConexion('Error de lectura en Firebase');
            });
        } catch (err) {
            console.error('Error activando listener:', err);
        }
    }

    function guardarBD() {
        if (!db) return;
        
        // Convertimos arrays a objetos con clave id para Firebase
        const inventarioObj = {};
        DB.inventario.forEach(p => inventarioObj[p.id] = p);

        const ventasObj = {};
        DB.ventas.forEach(v => ventasObj[v.id] = v);

        const gastosObj = {};
        DB.gastos.forEach(g => gastosObj[g.id] = g);

        const devolucionesObj = {};
        DB.devoluciones.forEach(d => devolucionesObj[d.id] = d);

        db.ref('tikiraka_app').set({
            inventario: inventarioObj,
            caja: DB.caja,
            historialBase: DB.historialBase,
            ventas: ventasObj,
            gastos: gastosObj,
            devoluciones: devolucionesObj,
            socios: DB.socios
        });
    }

    /* ==========================================================
       LÓGICA DE REGISTRO DE OPERACIONES (VENTAS, GASTOS, DEVOLUCIONES, COMENTARIOS)
       ========================================================== */
    function toggleOperacion() {
        const tipo = document.getElementById('tipo-operacion').value;
        document.getElementById('form-venta').style.display = (tipo === 'venta') ? 'block' : 'none';
        document.getElementById('form-gasto').style.display = (tipo === 'gasto') ? 'block' : 'none';
        document.getElementById('form-devolucion').style.display = (tipo === 'devolucion') ? 'block' : 'none';
    }

    function toggleGastoStock() {
        const esStock = document.getElementById('gasto-es-stock').checked;
        document.getElementById('gasto-simple-fields').style.display = esStock ? 'none' : 'block';
        document.getElementById('gasto-stock-fields').style.display = esStock ? 'block' : 'none';
    }

    function procesarOperacion() {
        const tipo = document.getElementById('tipo-operacion').value;
        const metodoPago = document.getElementById('metodo-pago').value;
        const comentario = document.getElementById('operacion-comentario').value.trim();
        const fecha = new Date().toLocaleString('es-CO');
        const id = 'op_' + Date.now();

        if (tipo === 'venta') {
            const prodId = document.getElementById('venta-producto').value;
            const cantidad = parseInt(document.getElementById('venta-cantidad').value) || 0;
            const monto = parseFloat(document.getElementById('venta-monto').value) || 0;

            const producto = DB.inventario.find(p => p.id === prodId);
            if (!producto || cantidad <= 0 || monto <= 0) return alert('Verifica los datos de la venta.');
            if (producto.cantidad < cantidad) return alert('No hay suficiente stock.');

            // Ajustar Stock
            producto.cantidad -= cantidad;

            // Ajustar Caja
            if (metodoPago === 'Efectivo') DB.caja.efectivo += monto;
            else DB.caja.nequi += monto;

            // Registrar Venta en BD
            DB.ventas.unshift({
                id, fecha, productoId: producto.id, productoNombre: producto.nombre,
                cantidad, monto, metodoPago, comentario
            });

        } else if (tipo === 'gasto') {
            const esStock = document.getElementById('gasto-es-stock').checked;
            const monto = parseFloat(document.getElementById('gasto-monto').value) || 0;
            let concepto = '';

            if (monto <= 0) return alert('Ingresa un monto válido para el gasto.');

            if (esStock) {
                const prodId = document.getElementById('gasto-producto').value;
                const cantidad = parseInt(document.getElementById('gasto-cantidad-stock').value) || 0;
                const producto = DB.inventario.find(p => p.id === prodId);
                
                if (!producto || cantidad <= 0) return alert('Selecciona un producto y cantidad válida.');
                producto.cantidad += cantidad; // Sube el stock
                concepto = `Compra stock: ${cantidad}x ${producto.nombre}`;
            } else {
                concepto = document.getElementById('gasto-concepto').value.trim();
                if (!concepto) return alert('Escribe el concepto del gasto.');
            }

            // Descontar de Caja
            if (metodoPago === 'Efectivo') DB.caja.efectivo -= monto;
            else DB.caja.nequi -= monto;

            // Registrar Gasto en BD
            DB.gastos.unshift({
                id, fecha, concepto, monto, metodoPago, comentario
            });

        } else if (tipo === 'devolucion') {
            const prodId = document.getElementById('devolucion-producto').value;
            const cantidad = parseInt(document.getElementById('devolucion-cantidad').value) || 0;
            const monto = parseFloat(document.getElementById('devolucion-monto').value) || 0;

            const producto = DB.inventario.find(p => p.id === prodId);
            if (!producto || cantidad <= 0 || monto <= 0) return alert('Verifica los datos de la devolución.');

            // Disminuir Stock (se devuelve al proveedor)
            producto.cantidad = Math.max(0, producto.cantidad - cantidad);

            // Reembolso entra a Caja
            if (metodoPago === 'Efectivo') DB.caja.efectivo += monto;
            else DB.caja.nequi += monto;

            // Registrar Devolución en BD
            DB.devoluciones.unshift({
                id, fecha, productoId: producto.id, productoNombre: producto.nombre,
                cantidad, monto, metodoPago, comentario
            });
        }

        // Limpiar Comentario y Guardar
        document.getElementById('operacion-comentario').value = '';
        guardarBD();
        actualizarUI();
        alert('Movimiento registrado con éxito.');
    }

    /* ==========================================================
       GESTIÓN DE INVENTARIO Y SALDO BASE
       ========================================================== */
    function agregarProducto() {
        const nombre = document.getElementById('prod-nombre').value.trim();
        const cantidad = parseInt(document.getElementById('prod-cantidad').value) || 0;
        const costo = parseFloat(document.getElementById('prod-costo').value) || 0;
        const precio = parseFloat(document.getElementById('prod-precio').value) || 0;
        const fileInput = document.getElementById('prod-foto');

        if (!nombre) return alert('Escribe un nombre de producto.');

        const guardar = (fotoBase64) => {
            DB.inventario.push({
                id: 'prod_' + Date.now(),
                nombre, cantidad, costo, precio,
                foto: fotoBase64 || ''
            });
            guardarBD();
            actualizarUI();
            
            document.getElementById('prod-nombre').value = '';
            document.getElementById('prod-cantidad').value = '';
            document.getElementById('prod-costo').value = '';
            document.getElementById('prod-precio').value = '';
            fileInput.value = '';
        };

        if (fileInput.files && fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => guardar(e.target.result);
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            guardar('');
        }
    }

    function modificarSaldoBase(cajaTipo, accion) {
        const inputId = cajaTipo === 'efectivo' ? 'base-efectivo' : 'base-nequi';
        const monto = parseFloat(document.getElementById(inputId).value) || 0;
        if (monto <= 0) return;

        let saldoAnterior = DB.caja[cajaTipo];
        if (accion === 'fijar') DB.caja[cajaTipo] = monto;
        else if (accion === 'sumar') DB.caja[cajaTipo] += monto;
        else if (accion === 'restar') DB.caja[cajaTipo] = Math.max(0, DB.caja[cajaTipo] - monto);

        DB.historialBase.unshift({
            fecha: new Date().toLocaleString('es-CO'),
            caja: cajaTipo.toUpperCase(),
            accion: accion.toUpperCase(),
            monto,
            saldoFinal: DB.caja[cajaTipo]
        });

        document.getElementById(inputId).value = '';
        guardarBD();
        actualizarUI();
    }

    /* ==========================================================
       ACTUALIZACIÓN DE INTERFAZ DE USUARIO (UI)
       ========================================================== */
    function actualizarUI() {
        // Renderizar Totales Caja
        const efec = DB.caja.efectivo || 0;
        const neq = DB.caja.nequi || 0;
        document.getElementById('total-efectivo').textContent = formatoMoneda(efec);
        document.getElementById('total-nequi').textContent = formatoMoneda(neq);
        document.getElementById('total-general').textContent = formatoMoneda(efec + neq);

        // Renderizar Tabla Inventario
        const tbodyInv = document.getElementById('tabla-inventario');
        tbodyInv.innerHTML = DB.inventario.map(p => `
            <tr>
                <td>${p.foto ? `<img src="${p.foto}" class="img-thumb">` : '📦'}</td>
                <td><strong>${p.nombre}</strong></td>
                <td>${p.cantidad}</td>
                <td>${formatoMoneda(p.precio)}</td>
                <td>
                    <button class="btn" style="padding: 4px 8px;" onclick="eliminarProducto('${p.id}')">🗑️</button>
                </td>
            </tr>
        `).join('');

        // Cargar Opciones de Productos en Selects
        const comboProds = `<option value="">Selecciona un Producto...</option>` + 
            DB.inventario.map(p => `<option value="${p.id}">${p.nombre} (Stock: ${p.cantidad})</option>`).join('');
        
        document.getElementById('venta-producto').innerHTML = comboProds;
        document.getElementById('gasto-producto').innerHTML = comboProds;
        document.getElementById('devolucion-producto').innerHTML = comboProds;

        // Render Historial Ventas con COMENTARIOS
        document.getElementById('tabla-historial-ventas').innerHTML = DB.ventas.map(v => `
            <tr>
                <td>${v.fecha}</td>
                <td>${v.productoNombre}</td>
                <td>${v.cantidad}</td>
                <td>${formatoMoneda(v.monto)}</td>
                <td>${v.metodoPago}</td>
                <td><small>${v.comentario || '-'}</small></td>
                <td><button class="btn btn-danger" onclick="eliminarVenta('${v.id}')">🗑️</button></td>
            </tr>
        `).join('');

        // Render Historial Gastos
        document.getElementById('tabla-historial-gastos').innerHTML = DB.gastos.map(g => `
            <tr>
                <td>${g.fecha}</td>
                <td>${g.concepto}</td>
                <td>${formatoMoneda(g.monto)}</td>
                <td>${g.metodoPago}</td>
                <td><small>${g.comentario || '-'}</small></td>
            </tr>
        `).join('');

        // Render Historial Devoluciones
        document.getElementById('tabla-historial-devoluciones').innerHTML = DB.devoluciones.map(d => `
            <tr>
                <td>${d.fecha}</td>
                <td>${d.productoNombre}</td>
                <td>${d.cantidad}</td>
                <td>${formatoMoneda(d.monto)}</td>
                <td>${d.metodoPago}</td>
                <td><small>${d.comentario || '-'}</small></td>
            </tr>
        `).join('');
    }

    function autofillPrecioVenta() {
        const prodId = document.getElementById('venta-producto').value;
        const cant = parseInt(document.getElementById('venta-cantidad').value) || 1;
        const prod = DB.inventario.find(p => p.id === prodId);
        if (prod) document.getElementById('venta-monto').value = prod.precio * cant;
    }

    function autofillCostoGasto() {
        const prodId = document.getElementById('gasto-producto').value;
        const cant = parseInt(document.getElementById('gasto-cantidad-stock').value) || 1;
        const prod = DB.inventario.find(p => p.id === prodId);
        if (prod) document.getElementById('gasto-monto').value = prod.costo * cant;
    }

    function autofillMontoDevolucion() {
        const prodId = document.getElementById('devolucion-producto').value;
        const cant = parseInt(document.getElementById('devolucion-cantidad').value) || 1;
        const prod = DB.inventario.find(p => p.id === prodId);
        if (prod) document.getElementById('devolucion-monto').value = prod.costo * cant;
    }

    function eliminarProducto(id) {
        if (!confirm('¿Seguro que deseas eliminar este producto?')) return;
        DB.inventario = DB.inventario.filter(p => p.id !== id);
        guardarBD();
        actualizarUI();
    }

    function cambiarTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    function toggleBasePanel() {
        const content = document.getElementById('base-collapsible-content');
        const icon = document.getElementById('base-toggle-icon');
        if (content.style.display === 'block') {
            content.style.display = 'none';
            icon.textContent = '▼';
        } else {
            content.style.display = 'block';
            icon.textContent = '▲';
        }
    }

    // Inicialización al Cargar la página
    window.addEventListener('DOMContentLoaded', () => {
        crearPanelConexion();
        precargarFirebase();
    });
</script>
